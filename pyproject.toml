[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["venv", "build", "dist"]

[tool.ruff.lint]
# Start strict on correctness; expand later with I (imports), UP, B, etc.
select = ["F", "E", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
